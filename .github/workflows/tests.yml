name: Hyvä Admin Tests

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    compute-matrix:
        name: Compute Matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            # Kind "latest" is the newest Magento Open Source release (magento/project-community-edition without a
            # version constraint), with the PHP version and services (MariaDB, OpenSearch, ...) it requires.
            # Pinned to a commit of main, because the latest tag (v1.7.3) predates Magento 2.4.9.
            -   uses: mage-os/github-actions/supported-version@81def9eba7703706b3f0aa99b3ce923857ba98e4
                id: supported-version
                with:
                    kind: latest
                    project: magento-open-source

            # Also test the same Magento version on PHP 8.5, which Magento 2.4.9 supports, too.
            # Only the include list is kept: with the top level "magento" key of the computed matrix, the second
            # include entry would replace the PHP version of the first one instead of adding a job.
            -   name: Add PHP 8.5
                id: matrix
                env:
                    MATRIX: ${{ steps.supported-version.outputs.matrix }}
                run: |
                    matrix=$(jq -c '{include: (.include + [.include[0] + {php: 8.5}])}' <<< "$MATRIX")
                    echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
                    jq '.include[] | {magento, php, composer}' <<< "$matrix"

    tests:
        name: Tests
        needs: compute-matrix
        # Creates the Magento project, requires this module from the checkout through a path repository, starts the
        # services from the matrix and runs test_command in dev/tests/integration.
        uses: mage-os/github-actions/.github/workflows/integration.yaml@81def9eba7703706b3f0aa99b3ce923857ba98e4
        with:
            package_name: hyva-themes/module-magento2-admin
            matrix: ${{ needs.compute-matrix.outputs.matrix }}
            magento_repository: https://mirror.mage-os.org/
            fail-fast: false
            # The unit tests depend on the Magento framework, so they run in the Magento installation, too.
            test_command: >-
                ../../../vendor/bin/phpunit -c ../unit/phpunit.xml.dist ../../../vendor/hyva-themes/module-magento2-admin/Test/Unit
                && ../../../vendor/bin/phpunit ../../../vendor/hyva-themes/module-magento2-admin/Test/Integration
